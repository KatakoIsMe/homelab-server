  GNU nano 8.7.1                          docker-compose.yml
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: always
    ports:
      - "8080:80"
    volumes:
      - /mnt:/srv
      - ./config/filebrowser.db:/database.db
      - ./config/settings.json:/config.json
    environment:
      - PUID=1000
      - PGID=1000
      - FB_ADDR=0.0.0.0
      - FB_PORT=80
      - FB_DATABASE=/database.db
      - FB_CONFIG=/config.json
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      - "8081:80/tcp"
    volumes:
      - ./config/adguard/work:/opt/adguardhome/work
      - ./config/adguard/conf:/opt/adguardhome/conf
