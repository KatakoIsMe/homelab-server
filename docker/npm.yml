version: '3.8'
services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - /home/mardamar/npm/data:/data
      - /home/mardamar/npm/letsencrypt:/etc/letsencrypt
