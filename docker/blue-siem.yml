version: '3.8'

volumes:
  es_data:
    driver: local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms2g -Xmx4g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=ELASTICUSERNAME
      - ELASTICSEARCH_PASSWORD=ELASTICPASSWORD
      - XPACK_SECURITY_ENCRYPTIONKEY="ENCRYPTIONKEY"
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY="ENCRYPTEDSAVEDOBJECTSKEY"
      - XPACK_REPORTING_ENCRYPTIONKEY="REPORTINGENCRYPTIONKEY"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stoppe
